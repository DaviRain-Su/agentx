[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]

# Solc version
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# Remappings
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Testing
fuzz_runs = 256
verbosity = 3

# Gas reporting
gas_reports = ["*"]

# EVM version
evm_version = "paris"

# X Layer network configurations
[rpc_endpoints]
xlayer_testnet = "https://xlayertestrpc.okx.com"
xlayer_mainnet = "https://rpc.xlayer.tech"

[etherscan]
xlayer_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER_TESTNET" }
xlayer_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER" }
