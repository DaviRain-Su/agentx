name = "gradience-worker"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (set via wrangler secret)
[vars]
XLAYER_RPC_URL = "https://xlayertestrpc.okx.com"
XLAYER_CHAIN_ID = "195"

# KV Namespace for state management + session tokens
[[kv_namespaces]]
binding = "GRADIENCE_KV"
id = "bab4e5fbd4eb474186d8466929541b21"

# Secrets (use wrangler secret put)
# - PRIVATE_KEY (worker wallet for signing txs)
# - ANTHROPIC_API_KEY (required for pi-agent-core Agent class)
# - COINGECKO_API_KEY (optional)

# Cloudflare Workers AI
[ai]
binding = "AI"

# Durable Objects - one per agent session (SQLite-backed, persistent)
[durable_objects]
bindings = [
  { name = "AGENT_SESSIONS", class_name = "AgentSession" }
]

# SQLite migration for AgentSession
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]

# Scheduled task to poll for new events
[triggers]
crons = ["*/1 * * * *"]  # Every minute
